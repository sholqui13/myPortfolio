name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels the queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npx ng test --watch=false

      # The site is served from https://sholqui13.github.io/myPortfolio/
      - name: Build
        run: npx ng build --base-href /myPortfolio/

      # Unknown URLs fall back to the client-side shell, which redirects to Home.
      - name: Add 404 fallback
        run: cp dist/my-portfolio/browser/index.csr.html dist/my-portfolio/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/my-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
